name: Deploy

# Builds the images on every push to main and, once the server exists, rolls them out.
# Off until the repository variable DEPLOY_ENABLED is "true". Needs secrets DEPLOY_HOST,
# DEPLOY_USER and DEPLOY_SSH_KEY (see docs/deployment.md).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/essl_integration_service
  MIGRATE_IMAGE: ghcr.io/${{ github.repository_owner }}/essl_integration_service-migrate

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          docker build -t "$API_IMAGE:${GITHUB_SHA}" -t "$API_IMAGE:latest" .
          docker build -f Dockerfile.migrate -t "$MIGRATE_IMAGE:${GITHUB_SHA}" -t "$MIGRATE_IMAGE:latest" .
          docker push --all-tags "$API_IMAGE"
          docker push --all-tags "$MIGRATE_IMAGE"

  deploy:
    needs: images
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - name: SSH key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
      - name: Copy compose files and roll out
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
        run: |
          scp deploy/docker-compose.yml deploy/Caddyfile deploy/*.sh "$TARGET:/opt/najah/"
          ssh "$TARGET" "cd /opt/najah && \
            sed -i 's#^API_IMAGE=.*#API_IMAGE=$API_IMAGE:${GITHUB_SHA}#; s#^MIGRATE_IMAGE=.*#MIGRATE_IMAGE=$MIGRATE_IMAGE:${GITHUB_SHA}#' .env && \
            docker compose --env-file .env -f docker-compose.yml pull api migrate && \
            docker compose --env-file .env -f docker-compose.yml up -d --wait && \
            docker image prune -f"
